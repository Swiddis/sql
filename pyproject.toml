[project]
name = "ppl-correctness"
version = "0.1.0"
description = "Property-based correctness testing for OpenSearch PPL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opensearch-py>=2.0.0",
    "hypothesis>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]
